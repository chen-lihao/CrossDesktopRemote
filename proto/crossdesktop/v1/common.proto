syntax = "proto3";

package crossdesktop.v1;

option java_multiple_files = true;
option java_package = "com.crossdesktopremote.protocol.v1";
option java_outer_classname = "CommonProto";

message ProtocolVersion {
  uint32 major = 1;
  uint32 minor = 2;
}

message RequestContext {
  ProtocolVersion protocol_version = 1;
  string request_id = 2;
  uint64 sent_at_unix_ms = 3;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_ARGUMENT = 1;
  ERROR_CODE_UNAUTHENTICATED = 2;
  ERROR_CODE_PERMISSION_DENIED = 3;
  ERROR_CODE_NOT_FOUND = 4;
  ERROR_CODE_CONFLICT = 5;
  ERROR_CODE_RATE_LIMITED = 6;
  ERROR_CODE_UNSUPPORTED_VERSION = 7;
  ERROR_CODE_INTERNAL = 8;
  ERROR_CODE_UNAVAILABLE = 9;
}

message ErrorStatus {
  ErrorCode code = 1;
  string message = 2;
  bool retryable = 3;
  uint32 retry_after_ms = 4;
}
