syntax = "proto3";

package crossdesktop.v1;

import "crossdesktop/v1/common.proto";

option java_multiple_files = true;
option java_package = "com.crossdesktopremote.protocol.v1";
option java_outer_classname = "TransferProto";

enum TransferTransportKind {
  TRANSFER_TRANSPORT_KIND_UNSPECIFIED = 0;
  TRANSFER_TRANSPORT_KIND_WEBRTC = 1;
  TRANSFER_TRANSPORT_KIND_QUIC = 2;
}

enum TransferDirection {
  TRANSFER_DIRECTION_UNSPECIFIED = 0;
  TRANSFER_DIRECTION_UPLOAD = 1;
  TRANSFER_DIRECTION_DOWNLOAD = 2;
}

enum TransferEntryType {
  TRANSFER_ENTRY_TYPE_UNSPECIFIED = 0;
  TRANSFER_ENTRY_TYPE_FILE = 1;
  TRANSFER_ENTRY_TYPE_DIRECTORY = 2;
}

enum TransferDecisionType {
  TRANSFER_DECISION_TYPE_UNSPECIFIED = 0;
  TRANSFER_DECISION_TYPE_ACCEPT = 1;
  TRANSFER_DECISION_TYPE_REJECT = 2;
}

enum TransferCommandType {
  TRANSFER_COMMAND_TYPE_UNSPECIFIED = 0;
  TRANSFER_COMMAND_TYPE_PAUSE = 1;
  TRANSFER_COMMAND_TYPE_RESUME = 2;
  TRANSFER_COMMAND_TYPE_CANCEL = 3;
}

enum TransferWireState {
  TRANSFER_WIRE_STATE_UNSPECIFIED = 0;
  TRANSFER_WIRE_STATE_OFFERED = 1;
  TRANSFER_WIRE_STATE_TRANSFERRING = 2;
  TRANSFER_WIRE_STATE_PAUSED = 3;
  TRANSFER_WIRE_STATE_VERIFYING = 4;
  TRANSFER_WIRE_STATE_COMPLETED = 5;
  TRANSFER_WIRE_STATE_FAILED = 6;
  TRANSFER_WIRE_STATE_CANCELLED = 7;
}

message TransferCapabilities {
  ProtocolVersion protocol_version = 1;
  repeated TransferTransportKind transports = 2;
  uint32 max_wire_fragment_bytes = 3;
  uint32 max_in_flight_fragments = 4;
  uint64 max_single_file_bytes = 5;
  uint32 max_entries = 6;
  bool supports_resume = 7;
  bool supports_sha256 = 8;
}

message TransferEntry {
  uint32 entry_index = 1;
  string relative_path = 2;
  TransferEntryType type = 3;
  uint64 size_bytes = 4;
  uint64 modified_at_unix_ms = 5;
  bytes sha256 = 6;
}

message TransferOffer {
  RequestContext context = 1;
  string transfer_id = 2;
  TransferDirection direction = 3;
  repeated TransferEntry entries = 4;
  uint64 total_bytes = 5;
  bool clipboard_initiated = 6;
}

message TransferDecision {
  RequestContext context = 1;
  string transfer_id = 2;
  TransferDecisionType decision = 3;
  ErrorStatus error = 4;
}

message TransferCommand {
  RequestContext context = 1;
  string transfer_id = 2;
  TransferCommandType command = 3;
}

message TransferFileChunk {
  uint32 protocol_version = 1;
  string transfer_id = 2;
  uint32 entry_index = 3;
  uint64 offset = 4;

  // The logical resume block may be larger, but each WebRTC message is
  // bounded to 16 KiB to avoid monopolizing the SCTP association.
  bytes payload = 5;
  bool end_of_entry = 6;
}

message TransferResumeBitmap {
  RequestContext context = 1;
  string transfer_id = 2;
  uint32 entry_index = 3;
  uint32 logical_block_bytes = 4;
  uint64 total_bytes = 5;
  bytes completed_blocks = 6;
}

message TransferProgress {
  RequestContext context = 1;
  string transfer_id = 2;
  TransferWireState state = 3;
  uint64 transferred_bytes = 4;
  uint64 total_bytes = 5;
  ErrorStatus error = 6;
}

message TransferEnvelope {
  oneof message {
    TransferOffer offer = 1;
    TransferDecision decision = 2;
    TransferCommand command = 3;
    TransferFileChunk file_chunk = 4;
    TransferResumeBitmap resume_bitmap = 5;
    TransferProgress progress = 6;
  }
}
