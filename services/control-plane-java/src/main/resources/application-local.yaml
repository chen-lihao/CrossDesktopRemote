server:
  address: 0.0.0.0
  port: 8080

spring:
  datasource:
    url: ${CROSSDESKTOP_DATABASE_URL:jdbc:postgresql://localhost:5432/crossdesktop}
    username: ${CROSSDESKTOP_POSTGRES_USER:crossdesktop}
    password: ${CROSSDESKTOP_POSTGRES_PASSWORD:crossdesktop_dev_only}
  data:
    redis:
      host: ${CROSSDESKTOP_REDIS_HOST:localhost}
      port: ${CROSSDESKTOP_REDIS_PORT:6379}
      password: ${CROSSDESKTOP_REDIS_PASSWORD:crossdesktop_dev_only}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  health:
    db:
      enabled: true
    redis:
      enabled: true
