plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.crossdesktopremote'
version = '0.0.1-SNAPSHOT'
description = 'CrossDesktopRemote control plane'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'com.google.protobuf:protobuf-java:4.35.1'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-websocket-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets {
	main {
		java {
			srcDir layout.buildDirectory.dir('generated/sources/proto/main/java')
		}
	}
}

def protocolRoot = file('../../proto')
def generatedProtocolJava = layout.buildDirectory.dir('generated/sources/proto/main/java')
def protocolSources = [
	'crossdesktop/v1/common.proto',
	'crossdesktop/v1/clipboard.proto',
	'crossdesktop/v1/transfer.proto',
	'crossdesktop/v1/capability.proto',
	'crossdesktop/v1/device.proto',
	'crossdesktop/v1/input.proto',
	'crossdesktop/v1/session.proto',
	'crossdesktop/v1/signaling.proto',
].collect { new File(protocolRoot, it) }

tasks.register('generateProtocolJava', Exec) {
	description = 'Generates a clean Java Protobuf tree for the control plane.'
	group = 'build'
	inputs.files(protocolSources)
	outputs.dir(generatedProtocolJava)
	// The shared generation script and IDEs can modify this ignored directory
	// outside Gradle. Always rebuild it so an orphaned Java class can never be
	// considered an up-to-date output and mixed with the current descriptors.
	outputs.upToDateWhen { false }

	doFirst {
		def outputDirectory = generatedProtocolJava.get().asFile
		delete(outputDirectory)
		outputDirectory.mkdirs()
	}

	def protocExecutable = providers.environmentVariable('CROSSDESKTOP_PROTOC')
		.orElse('protoc')
	commandLine(
		protocExecutable.get(),
		"--proto_path=${protocolRoot.absolutePath}",
		"--java_out=${generatedProtocolJava.get().asFile.absolutePath}",
		*protocolSources.collect { it.absolutePath },
	)
}

tasks.named('compileJava') {
	dependsOn tasks.named('generateProtocolJava')
}

tasks.named('test') {
	useJUnitPlatform()
}
